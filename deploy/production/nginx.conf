server {
  listen 8080;
  return 308 https://$host$request_uri;
}
server {
  listen 8443 ssl;
  server_name _;
  ssl_certificate /run/secrets/tls_certificate;
  ssl_certificate_key /run/secrets/tls_key;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 2m;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Frame-Options SAMEORIGIN always;
  location /api/ {
    proxy_pass http://application:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 30s;
  }
  location = /api/v1/pur/order-imports {
    client_max_body_size 102m;
    proxy_pass http://application:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 30s;
  }
  location = /ready {
    access_log off;
    proxy_pass http://application:8080/actuator/health/readiness;
  }
  location /actuator/ { return 404; }
  location ~* \.(?:js|css|woff2?|svg|png|ico)$ {
    root /usr/share/nginx/html;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
