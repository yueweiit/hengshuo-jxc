# Dedicated business site. Financial posting and closing remain unavailable.
# Install only after DNS, loopback gateway readiness and certificate ownership checks.
# Replace example host/certificate paths only after verifying actual ownership.
# Business writes use the existing backend permissions and rules. Financial
# posting/closing and unreviewed opening/factory paths remain unavailable.
map "$request_method:$uri" $jxc_financial_mutation_blocked {
    default 0;
    ~^(POST|PUT|PATCH|DELETE):/api/v1/fin/vouchers/batch-post 1;
    ~^(POST|PUT|PATCH|DELETE):/api/v1/fin/vouchers/[^/]+/(post|reverse) 1;
    ~^(POST|PUT|PATCH|DELETE):/api/v1/fin/periods/[^/]+/(close|close-check|waive|reopen) 1;
    ~^(POST|PUT|PATCH|DELETE):/api/v1/fin/opening-balances 1;
    ~^(POST|PUT|PATCH|DELETE):/api/v1/sys/(country-clone-jobs|template-upgrades|country-templates) 1;
}

server {
    listen 80;
    server_name erp.example.com;
    return 308 https://erp.example.com$request_uri;
}

server {
    listen 443 ssl;
    server_name erp.example.com;
    ssl_certificate /etc/letsencrypt/live/erp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    default_type application/json;
    client_max_body_size 2m;
    add_header X-JXC-Mode business-no-posting always;

    location / {
        if ($jxc_financial_mutation_blocked) {
            return 403 '{"code":"FINANCIAL_OPERATION_DISABLED","message":"业务操作已开放；期初资料待确认，财务记账、冲销和结账未开放。","data":null}';
        }
        proxy_pass https://127.0.0.1:18443;
        proxy_ssl_server_name on;
        proxy_ssl_name erp.example.com;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host erp.example.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host erp.example.com;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
