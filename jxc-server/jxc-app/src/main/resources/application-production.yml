jxc:
  production:
    enabled: true
  jobs:
    enabled: true
management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,productionCapabilities
      show-details: never
spring:
  flyway:
    enabled: false
server:
  forward-headers-strategy: framework
